<h2>Architecture Figure 应展示模块归属，而不是运行流水线</h2>
<p class="subtitle">一块是一个可独立修改的模块边界；块内写清熟悉职责和 owner；一条线是一个公开接口依赖。</p>

<div class="ownership-rule">

</div>
